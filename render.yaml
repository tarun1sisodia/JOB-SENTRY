services:
  # Node API only; this blueprint does not provision the Python ML service.
  - type: web
    name: jobsentry-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
